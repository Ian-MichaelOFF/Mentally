<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./src/recuperacionMaster.css" />
    <title>Mentally</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            MENTALLY
            <img src="./src/logos/cerebro.png" alt="img">
        </div>
    <div class="sesion">
        <p>
            Bienvenido De vuelta!
        </p>
    </nav>
    <div class="formulario">
        <form action="formulario-maestro.html" method="POST">
            <h2>Recuperacion contraseña <br>Maestro

            <p>Ingresa tu correo  y Recibiras un <br>correo donde vendran los pasos <br> para la recuperacion de tu cuenta</p>
            </div>  
            <label for="email">Correo Electrónico:</label>
              <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" autocomplete="email" required>
              <button type="submit">Enviar correo<br> de recuperacion</button>
            </form>
              
        </form>
    </div>
