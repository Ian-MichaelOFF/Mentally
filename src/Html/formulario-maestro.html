<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/formmaster.css" />
    <title>Mentally</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            MENTALLY
            <img src="./src/logos/cerebro.png" alt="img">
        </div>
    <div class="sesion">
        <p>
            Bienvenido De vuelta!
        </p>
    </nav>
    <div class="formulario">
        <form action="formulario-maestro.html" method="POST">
            <h2>Inicio de Sesión <br>Maestro
            </h2>
              <label for="email">Correo Electrónico:</label>
              <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" autocomplete="email" required>
            </form>
    
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Contraseña123">
            <a href="./recuperacionMaster.html">¿Se te olvido la contraseña?</a>
            <button type="submit">Iniciar Sesión</button>
            
            <a href="./Registro_Master.html"><button class="btn">Registrarse</button></a>
            <button class="google-btn">
            <img src="./src/logos/google.png" alt="Google Logo" class="google-logo">
              Registrarse con Google
            </button>
            <a href="./formulario-alum.html">¿Eres Alumno?</a>                
        </form>
    </div>
    
</body>
</html>
